plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = "${minecraft_version}-${mod_version}-${tag_lanzador}"
group = mod_group_id

base {
    archivesName = mod_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

def nativeStructureRun = providers.gradleProperty('nativeStructureTestRun').getOrElse('local')
if (!(nativeStructureRun ==~ /[a-zA-Z0-9_-]+/)) throw new GradleException('Invalid nativeStructureTestRun')
def loadNativeStructureTests = providers.gradleProperty('nativeStructureTests').isPresent() ||
        gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('nativestructuretest') }

sourceSets {
    nativeStructureTest {
        java.setSrcDirs(['src/nativeStructureTest/java'])
        resources.setSrcDirs(['src/nativeStructureTest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    nativeStructureTestImplementation.extendsFrom implementation
    nativeStructureTestCompileOnly.extendsFrom compileOnly
    nativeStructureTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.findProperty('dev_neo_version') ?: neo_version

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    parchment {
        minecraftVersion = project.property('neogradle.subsystems.parchment.minecraftVersion')
        mappingsVersion = project.property('neogradle.subsystems.parchment.mappingsVersion')
    }

    runs {
        configureEach {
            gameDirectory = file('run/')
            systemProperty 'fml.earlyprogresswindow', 'false'
            systemProperty 'neoforge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            if (findProperty('vm_server')) {
                programArguments.addAll '--quickPlayMultiplayer', findProperty('vm_server').toString()
            }
            def world = findProperty('vm_world') ?: 'world'
            if (!findProperty('vm_server') && world && file("run/saves/${world}").isDirectory()) {
                programArguments.addAll '--quickPlaySingleplayer', world.toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        nativeStructureTests {
            type = 'gameTestServer'
            gameDirectory = file("run/native-structure-${nativeStructureRun}")
            programArgument '--world'
            programArgument file("build/native-structure-${nativeStructureRun}-world").absolutePath
            systemProperty 'neoforge.enabledGameTestNamespaces', 'botania_structure_tests'
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (loadNativeStructureTests) sourceSet(sourceSets.nativeStructureTest)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'assets/botania/patchouli_books/lexicon/en_us/README'
    exclude '.cache'
}

repositories {
    mavenCentral()
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'C4'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'CaffeineMC'
        url = 'https://maven.caffeinemc.net/releases'
        content {
            includeGroup 'net.caffeinemc'
        }
    }
    maven {
        name = 'LatvianDev'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
        content {
            includeGroup 'com.unascribed'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Bai'
        url = 'https://maven.bai.lol'
        content {
            includeGroup 'mcp.mobius.waila'
            includeGroup 'lol.bai'
        }
    }
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
            includeGroup 'dev.engine-room.vanillin'
        }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
}

def devMod = { String name ->
    project.hasProperty("with_${name}") || (!project.hasProperty("minimal") && !project.hasProperty("no_${name}"))
}

dependencies {
    // Patchouli
    implementation "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Just Enough Items (JEI)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

   // Emi
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"

    // Roughly Enough Items (REI)
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}"

     // Curios
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    if (!project.hasProperty('no_curios')) {
        runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    }

    // Ears API
    compileOnly 'com.unascribed:ears-api:1.4.5'

    compileOnly "net.caffeinemc:sodium-neoforge-api:${sodium_version}"

    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    if (devMod('kubejs')) {
        runtimeOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
        runtimeOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    }

    compileOnly "maven.modrinth:jade:${jade_version}"

    compileOnly "mcp.mobius.waila:wthit-api:neo-${wthit_version}"

    compileOnly "net.darkhax.botanypots:botanypots-neoforge-1.21.1:${botanypots_version}"
    compileOnly "net.darkhax.bookshelf:bookshelf-neoforge-1.21.1:${bookshelf_version}"
    compileOnly "net.darkhax.pricklemc:prickle-neoforge-1.21.1:${prickle_version}"
    if (devMod('botanypots')) {
        runtimeOnly("net.darkhax.botanypots:botanypots-neoforge-1.21.1:${botanypots_version}") { transitive = false }
        runtimeOnly("net.darkhax.bookshelf:bookshelf-neoforge-1.21.1:${bookshelf_version}") { transitive = false }
        runtimeOnly("net.darkhax.pricklemc:prickle-neoforge-1.21.1:${prickle_version}") { transitive = false }
    }

    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    if (devMod('ponder')) {
        runtimeOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}") { transitive = false }
        runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}") { transitive = false }
    }

    compileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:${ars_nouveau_version}") { transitive = false }
    compileOnly("software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}") { transitive = false }
    compileOnly("com.hollingsworth.nuggets:nuggets-neoforge-1.21.1:${ars_nuggets_version}") { transitive = false }
    if (project.hasProperty('with_ars_nouveau') || (devMod('ars_nouveau') && !project.hasProperty('no_curios'))) {
        runtimeOnly("com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:${ars_nouveau_version}") { transitive = false }
        runtimeOnly("software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}") { transitive = false }
    }

    if (devMod('spectrum') && !project.hasProperty('no_curios')) {
        runtimeOnly "maven.modrinth:spectrum:${spectrum_version}"
        runtimeOnly "maven.modrinth:revelationary:${revelationary_version}"
        runtimeOnly "maven.modrinth:modonomicon:${modonomicon_version}"
    }

    if (project.hasProperty('with_thaumaturge') || project.hasProperty('thaumaturge_jar')) {
        runtimeOnly "maven.modrinth:lithostitched:${lithostitched_version}"
        if (project.hasProperty('thaumaturge_jar')) {
            runtimeOnly files(project.property('thaumaturge_jar'))
        }
    }


    switch (project.findProperty('runtime_itemlist_mod') ?: 'jei') {
        case 'emi':
            runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
            break
        case 'rei':
            runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
            break
        case 'jei':
            runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
            break
    }

    if (!project.hasProperty('minimal')) {
        switch (project.findProperty('runtime_tooltip_mod') ?: 'jade') {
            case 'jade':
                runtimeOnly "maven.modrinth:jade:${jade_version}"
                break
            case 'wthit':
                runtimeOnly "mcp.mobius.waila:wthit:neo-${wthit_version}"
                break
        }
    }

   // Annotations
    compileOnly 'org.jetbrains:annotations:24.0.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version     : minecraft_version,
            neo_version           : neo_version,
            neo_version_range     : neo_version_range,
            loader_version_range  : loader_version_range,
            mod_name              : mod_name,
            mod_id                : mod_id,
            mod_version           : mod_version,
            mod_description       : mod_description,
            authors               : authors,
            background            : background,
            item_icon             : item_icon,
            issue_tracker         : issue_tracker,
            mod_license           : mod_license,
            patchouli_version     : patchouli_version,
            jei_version            : jei_version,
            emi_version            : emi_version,
            rei_version            : rei_version,
            curios_version         : curios_version,
            sodium_version         : sodium_version,
            kubejs_version         : kubejs_version,
            rhino_version          : rhino_version,
            jade_version           : jade_version,
            wthit_version          : wthit_version,
            ears_version            : ears_version,
            botanypots_version      : botanypots_version,
            ponder_version          : ponder_version,
            ars_nouveau_version_range: ars_nouveau_version_range,
            thaumaturge_version     : thaumaturge_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : 'vazkii',
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'vazkii',
        ])
    }
}

sourceSets {
    coremod
}

sourceSets.coremod.compileClasspath = sourceSets.main.compileClasspath

def coremodArtifact = 'botania-spectrum-coremod'
def coremodFile = "${coremodArtifact}-${mod_version}.jar"

tasks.register('coremodJar', Jar) {
    dependsOn tasks.named('coremodClasses')
    from sourceSets.coremod.output
    archiveBaseName = coremodArtifact
    archiveVersion = mod_version
    destinationDirectory = layout.buildDirectory.dir('coremod')
    manifest {
        attributes([
                'FMLModType'            : 'LIBRARY',
                'Automatic-Module-Name' : 'botania_spectrum_coremod',
                'Implementation-Version': mod_version,
        ])
    }
}

tasks.register('coremodMetadata') {
    def out = layout.buildDirectory.file('coremod/jarjar/metadata.json')
    def version = mod_version
    def artifact = coremodArtifact
    def file = coremodFile
    inputs.property('version', version)
    outputs.file(out)
    doLast {
        def target = out.get().asFile
        target.parentFile.mkdirs()
        target.text = "{\"jars\":[{\"identifier\":{\"group\":\"velrondevs.botania\",\"artifact\":\"${artifact}\"},\"version\":{\"range\":\"[${version},)\",\"artifactVersion\":\"${version}\"},\"path\":\"META-INF/jarjar/${file}\",\"isObfuscated\":false}]}"
    }
}

tasks.named('jar') {
    dependsOn tasks.named('coremodJar'), tasks.named('coremodMetadata')
    from(tasks.named('coremodJar').flatMap { it.archiveFile }) {
        into 'META-INF/jarjar'
    }
    from(layout.buildDirectory.file('coremod/jarjar/metadata.json')) {
        into 'META-INF/jarjar'
    }
}

tasks.register('prepareCoremodDev', Copy) {
    dependsOn tasks.named('coremodJar')
    from tasks.named('coremodJar').flatMap { it.archiveFile }
    into file('run/mods')
    rename { 'botania-spectrum-coremod-dev.jar' }
}

tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer', 'runNativeStructureTests'] }.configureEach {
    dependsOn tasks.named('prepareCoremodDev')
}

tasks.register('apiJar', Jar) {
    dependsOn classes
    from sourceSets.main.allJava
    from sourceSets.main.output
    include 'velrondevs/botania/api/**'
    archiveClassifier = 'api'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('printCompileClasspath') {
    def cp = sourceSets.main.compileClasspath
    doLast {
        new File(project.layout.buildDirectory.get().asFile, 'compile-classpath.txt').text = cp.asPath
    }
}

tasks.named('check') {
    dependsOn tasks.named('compileNativeStructureTestJava')
}
def nativeStructureLog = layout.projectDirectory.file("run/native-structure-${nativeStructureRun}/logs/latest.log").asFile
tasks.named('runNativeStructureTests') {
    doFirst { nativeStructureLog.delete() }
    doLast {
        if (!nativeStructureLog.isFile() || !(nativeStructureLog.text =~ /All [1-9][0-9]* required tests passed/)
                || nativeStructureLog.text =~ /[1-9][0-9]* required tests failed/) {
            throw new GradleException('Native Botania structure tests did not finish a successful, nonempty run')
        }
    }
}
